rules:
  # Apply before all direct/proxy exceptions; these affect traffic seen by Stash.
  - IP-CIDR6,::/0,REJECT,no-resolve
  - PROTOCOL,STUN,REJECT,no-track
  - RULE-SET,custom-reject,REJECT
  - RULE-SET,custom-proxy,节点选择
  - RULE-SET,custom-direct,DIRECT
  - RULE-SET,hk-bank,香港银行
  - RULE-SET,lan,DIRECT
  # AI dependencies (including humb.apple.com and Azure) precede broad service rules.
  - RULE-SET,custom-ai,AI 服务
  - RULE-SET,apple,Apple
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,tiktok,TikTok
  - RULE-SET,youtube,YouTube
  - RULE-SET,telegram,Telegram
  - RULE-SET,unban,DIRECT
  - RULE-SET,ban-ad,广告拦截
  - RULE-SET,ban-program-ad,广告拦截
  - RULE-SET,china-domain,DIRECT
  - RULE-SET,china-media,DIRECT
  - RULE-SET,china-company-ip,DIRECT
  - RULE-SET,china-ip,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,漏网之鱼

http:
  force-http-engine:
    - 'g.cn:80'
    - 'www.g.cn:80'
    - 'google.cn:80'
    - 'www.google.cn:80'
  # HTTPS rewrites require a separately configured, trusted MitM certificate.
  # No certificate or MitM hostnames are enabled by this public configuration.
  url-rewrite:
    - '^https?://(www\.)?g\.cn(?::\d+)?(?:/|$) https://www.google.com 302'
    - '^https?://(www\.)?google\.cn(?::\d+)?(?:/|$) https://www.google.com 302'
