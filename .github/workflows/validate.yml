name: Validate Shadowrocket config

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate_config.ps1
      - name: Validate on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./scripts/validate_config.sh
