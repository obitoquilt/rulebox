name: Validate proxy configs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Stash validator dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate Stash config
        run: python scripts/validate_stash.py
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate_config.ps1
      - name: Validate on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./scripts/validate_config.sh
